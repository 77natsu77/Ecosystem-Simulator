<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ecosystem Simulator</title>
    <style>
        body { background-color: #1e1e1e; color: white; font-family: 'Consolas', monospace; display: flex; }
        canvas { background-color: white; border: 2px solid gray; margin: 10px; }
        #ui-panel { background: rgba(0,0,0,0.8); padding: 20px; width: 450px; margin: 10px; border-radius: 5px; }
        .stable { color: limegreen; font-weight: bold; }
        .extinct { color: red; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
</head>
<body>
    <canvas id="simCanvas" width="1200" height="800"></canvas>
    
    <div id="ui-panel">
        <h3>------ ECOSYSTEM STATS ------</h3>
        <h4>--- POPULATION DETAILS ---</h4>
        <div>Population(Critter): <span id="s-critters"></span></div>
        <div>Critter Status: <span id="s-c-status"></span></div>
        <br>
        <div>Population(Predator): <span id="s-preds"></span></div>
        <div>Predator Status: <span id="s-p-status"></span></div>
        <br>
        <div>Food Count: <span id="s-food"></span></div>

        <h4>--- ENTITY INSPECTOR ---</h4>
        <div id="entity-details">Click an entity to inspect...</div>

    </div>
    <div id="ecosystem-stats">
    </div>

   

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let entities = [];
        let selectedEntityId = null;
        //  Click Handler
        canvas.addEventListener('mousedown', (event) => {
            // Get mouse pos relative to canvas
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            let closestEntity = null;
            let minDistance = 25; // Selection "hitbox" radius in pixels, should be larger than entity size for easier clicking


            entities.forEach(entity => {
                // Pythagoras to find distance from click to entity center
                const dx = mouseX - entity.X;
                const dy = mouseY - entity.Y;
                const distance = Math.hypot(dx, dy); // More accurate and cleaner than Math.sqrt(dx*dx + dy*dy)

                if (distance < minDistance) {
                    minDistance = distance;
                    closestEntity = entity;
                }
            });

            if (closestEntity) {
                selectedEntityId = closestEntity.Id;
            } else {
                selectedEntityId = null; // Clicked empty space
                document.getElementById('entity-details').innerText = "Click an entity to inspect...";
            }
        });

       

        const connection = new signalR.HubConnectionBuilder()
        .withUrl("/worldHub")
        .build();

        connection.on("frame", data => {

           // console.log("Parsed world state:", data);
                // Update Canvas Size dynamically if needed (based on world dimensions)
                canvas.width = data.Width;
                canvas.height = data.Height;
                entities = data.Entities; // Store entities for inspector access

                // Update UI Panel
                document.getElementById('s-critters').innerText = data.Stats.Critters;
                document.getElementById('s-preds').innerText = data.Stats.Predators;
                document.getElementById('s-food').innerText = data.Stats.Food;
               // console.log("Updating UI with stats:", data.Stats);
                const cStatus = document.getElementById('s-c-status');
                cStatus.innerText = data.Stats.Critters > 0 ? "STABLE" : "EXTINCT";
                cStatus.className = data.Stats.Critters > 0 ? "stable" : "extinct";

                const pStatus = document.getElementById('s-p-status');
                pStatus.innerText = data.Stats.Predators > 0 ? "STABLE" : "EXTINCT";
                pStatus.className = data.Stats.Predators > 0 ? "stable" : "extinct";

                // Clear screen
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Entities
                data.Entities.forEach(e => {
                    if (e.Type === "Food") {
                        ctx.fillStyle = "limegreen";
                        ctx.beginPath();
                        ctx.arc(e.X, e.Y, 2, 0, Math.PI * 2);
                        ctx.fill();
                    } 
                    else if (e.Type === "Critter") {
                        // Sight Radius
                        ctx.fillStyle = "rgba(128, 128, 128, 0.12)"; // Alpha 30 ~ 0.12
                        ctx.beginPath();
                        ctx.arc(e.X, e.Y, e.Sight, 0, Math.PI * 2);
                        ctx.fill();

                        // Body
                        ctx.fillStyle = `rgb(${e.R}, ${e.G}, ${e.B})`;
                        ctx.beginPath();
                        ctx.arc(e.X, e.Y, e.Size / 2, 0, Math.PI * 2);
                        ctx.fill();

                        // Velocity Arrow
                        if (data.ShowArrows) drawArrow(e.X, e.Y, e.VelX, e.VelY, e.Sight, "black");
                    }
                    else if (e.Type === "Smarty") {
                        // Sight Radius (Brighter if currently scanning, dimmer if just following path or idling)
                        ctx.fillStyle = e.IsScanning ? "rgba(0, 255, 255, 0.12)" : "rgba(128, 128, 255, 0.12)";
                        ctx.beginPath();
                        ctx.arc(e.X, e.Y, e.Sight, 0, Math.PI * 2);
                        ctx.fill();

                        // square to distinguish from critters, also looks cool
                        ctx.save();
                        ctx.fillStyle = `rgb(${e.R}, ${e.G}, ${e.B})`;
                        ctx.beginPath();
                        ctx.rect(e.X - e.Size/2, e.Y - e.Size/2, e.Size, e.Size);
                        ctx.fill();

                        // Velocity Arrow
                        if (data.ShowArrows) drawArrow(e.X, e.Y, e.VelX, e.VelY, e.Sight, "black");
                    }
                    else if (e.Type === "Predator") {
                        // Sight Radius (Red if cannibal, Black if normal)
                        ctx.fillStyle = e.Cannibal ? "rgba(255, 0, 0, 0.12)" : "rgba(0, 0, 0, 0.12)";
                        ctx.beginPath();
                        ctx.arc(e.X, e.Y, e.Sight, 0, Math.PI * 2);
                        ctx.fill();

                        // Diamond Body
                        ctx.save();
                        ctx.translate(e.X, e.Y);
                        ctx.fillStyle = `rgb(${e.R}, ${e.G}, ${e.B})`;
                        ctx.strokeStyle = "black";
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(0, -e.Size);
                        ctx.lineTo(e.Size/2, 0);
                        ctx.lineTo(0, e.Size);
                        ctx.lineTo(-e.Size/2, 0);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();

                        // Velocity Arrow
                        if (data.ShowArrows) drawArrow(e.X, e.Y, e.VelX, e.VelY, e.Sight, "black");
                    }
                    if (selectedEntityId !== null && e.Id === selectedEntityId) {
                    // MDN canvas API tutorial on creating a pulsing highlight effect is the basis for this code, along with some other styling and tweaks to make it look more "glowy" and dynamic. The idea is to create a ring around the selected entity that pulses in size and brightness to draw attention to it.
                    ctx.save();
                    
                    // Pulse value oscillates smoothly between 0 and 1
                    const pulse = (Math.sin(Date.now() / 400) + 1) / 2;
                    
                    ctx.beginPath();
                    // Aura grows and shrinks slightly with the pulse
                    const auraRadius = (e.Size / 2) + 3 + (pulse * 5);
                    ctx.arc(e.X, e.Y, auraRadius, 0, Math.PI * 2); 

                    // THE GLOW EFFECT
                    // Use shadowBlur for the "soft" light feel
                    ctx.shadowBlur = 20 + (pulse * 15); 
                    ctx.shadowColor = "rgba(0, 255, 255, 0.8)";
                    
                    // Lower globalAlpha makes the ring itself softer
                    ctx.globalAlpha = 0.2 + (pulse * 0.4);
                    
                    ctx.strokeStyle = "red"; // The core color of the glow
                    ctx.lineWidth = 3 + (pulse * 1.5); // Line width also pulses for extra emphasis
                    
                    // Ensure no dashes for a solid look
                    ctx.setLineDash([]); 

                    ctx.stroke();
                    ctx.restore();
                }});

            updateInspector();
        });

connection.start().catch(err => console.error(err));

        function drawArrow(x, y, vx, vy, sight, color) {
            if (vx === 0 && vy === 0) return;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.atan2(vy, vx)); // JS handles the rotation math for us!
            
            let tipX = sight * 2;
            
            // Shaft
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(tipX, 0);
            ctx.strokeStyle = color;
            ctx.stroke();
            
            // Arrowhead
            ctx.beginPath();
            ctx.moveTo(tipX, 0);
            ctx.lineTo(tipX - 10, 5);
            ctx.lineTo(tipX - 10, -5);
            ctx.fillStyle = color;
            ctx.fill();
            
            ctx.restore();
        }

        //  Update Logic for Inspector Panel
        function updateInspector() {
            if (selectedEntityId === null) return;

            // Find the locked entity in the current frame's data
            const selected = entities.find(e => e.Id === selectedEntityId);

            if (selected) {
                document.getElementById('entity-details').innerHTML = `
                    <strong>Type:</strong> ${selected.Type}<br>
                    <strong>ID:</strong> ${selected.Id}<br>
                    <strong>Energy:</strong> ${selected.Energy.toFixed(2)}<br>
                    <strong>Speed:</strong> ${selected.Speed.toFixed(2)}<br>
                    <strong>Position:</strong> (${selected.X.toFixed(0)}, ${selected.Y.toFixed(0)})<br>
                    <strong>Behavior:</strong> ${selected.Cannibal ? "CANNIBAL" : "Standard"}
                `;
            } else {
                // Entity likely died
                document.getElementById('entity-details').innerHTML = "<em>Entity has died or disappeared.</em>";
                selectedEntityId = null;
            }
        }
    </script>
</body>
</html>
